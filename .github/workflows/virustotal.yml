name: VirusTotal release scan

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to scan (e.g. v2.3.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: virustotal-release-scan
  cancel-in-progress: false

jobs:
  scan:
    if: github.repository == 'koala-1234/penny-chart'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Scan installers and update release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          if [ -z "$VT_API_KEY" ]; then echo "::error::VT_API_KEY secret is not set"; exit 1; fi
          tools/vt-scan.sh "$TAG" | tee -a "$GITHUB_STEP_SUMMARY"
