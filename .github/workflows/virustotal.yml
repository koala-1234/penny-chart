name: VirusTotal release reports

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: '검사할 태그 (비우면 최신 릴리스)'
        required: false
        type: string
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: virustotal-release-scan
  cancel-in-progress: false

jobs:
  scan:
    if: github.repository == 'koala-1234/penny-chart' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - name: Check VirusTotal configuration
        id: key
        shell: bash
        run: |
          if [ -n "$VT_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "VirusTotal 자동 검사는 VT_API_KEY Secret 등록 후 활성화됩니다. 이번 실행에서는 검사하지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.enabled == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.key.outputs.enabled == 'true'
        with:
          node-version: '24'
      - name: Scan published installers and update release notes
        if: steps.key.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || '' }}
        run: node tools/virustotal-release.mjs
